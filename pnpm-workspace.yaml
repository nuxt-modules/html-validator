packages:
  - docs
  - playground
  - playground-v5
  - test/fixtures/*

overrides:
  "@nuxt/content": "^3.11.0"
  "@nuxtjs/html-validator": "workspace:*"

shamefullyHoist: true

strictPeerDependencies: false

allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: true
  esbuild: false
  sharp: false
  simple-git-hooks: true
  unrs-resolver: false
  vue-demi: false

minimumReleaseAgeExclude:
  - '@nuxt/*'
  - nuxt-nightly
